<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Portrait placeholder for Md Sharifuzzaman Shajib">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#64ffda" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#dots)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#64ffda">
    <text x="50%" y="48%" text-anchor="middle" font-size="120" dominant-baseline="middle">SS</text>
    <text x="50%" y="72%" text-anchor="middle" font-size="14" letter-spacing="4" fill="#ccd6f6">PORTRAIT · PLACEHOLDER</text>
  </g>
</svg>
